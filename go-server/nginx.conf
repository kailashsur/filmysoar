server {
    listen 80;
    listen [::]:80;
    server_name api.filmysoar.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.filmysoar.online;

    ssl_certificate /etc/letsencrypt/live/api.filmysoar.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.filmysoar.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Increase client body size for file uploads
    client_max_body_size 100M;

    # Logs
    access_log /var/log/nginx/filmyfly_access.log;
    error_log /var/log/nginx/filmyfly_error.log;

    # Main application proxy
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    # Static files (served by Nginx for better performance)
    location /public/ {
        alias /home/filmysoar/app/go-server/public/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

}
